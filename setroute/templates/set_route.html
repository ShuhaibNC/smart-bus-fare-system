{% extends "base.html" %}
{% load static %}
{% block header %}{% endblock header %}
{% block content %}

<div class="route-container">
    <h2>🚌 Set Your Bus Route</h2>

    <div id="routes">
        <div class="route-box">
            <input type="text" placeholder="Enter Location / Stop 1">
            <button type="button" class="route-icon-btn location-btn">📍</button>
            <button type="button" class="route-icon-btn map-btn">🗺️</button>
            <button type="button" class="route-icon-btn delete-btn">✖</button>
        </div>

        <div class="route-box">
            <input type="text" placeholder="Enter Location / Stop 2">
            <button type="button" class="route-icon-btn location-btn">📍</button>
            <button type="button" class="route-icon-btn map-btn">🗺️</button>
            <button type="button" class="route-icon-btn delete-btn">✖</button>
        </div>
    </div>

    <button id="add-route-btn" class="route-btn route-btn-secondary">
        ➕ Add Another Stop
    </button>

    <button class="route-btn route-btn-primary" onclick="setRoute()">
        SET ROUTE
    </button>

    <div class="note">
        📍 Auto-detect • 🗺️ Google Maps • Max 4 Stops
    </div>
</div>

<script src="{% static 'assets/js/set_route.js' %}"></script>
{% endblock content %}
