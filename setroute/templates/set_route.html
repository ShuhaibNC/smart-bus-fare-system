{% extends "base.html" %}
{% load static %}
{% block header %}{% endblock header %}
{% block content %}

<form method="post" action="{% url 'add_route' %}">
    {% csrf_token %}

    <div class="route-container">
        <h2>🚌 Set Your Bus Route</h2>

        <div id="routes">

            <div class="route-box">
                <input type="text" name="stops[]" placeholder="Enter Location / Stop 1" required>
                <button type="button" class="route-icon-btn location-btn">📍</button>
                <button type="button" class="route-icon-btn map-btn">🗺️</button>
                <button type="button" class="route-icon-btn delete-btn">✖</button>
            </div>

            <div class="route-box">
                <input type="text" name="stops[]" placeholder="Enter Location / Stop 2" required>
                <button type="button" class="route-icon-btn location-btn">📍</button>
                <button type="button" class="route-icon-btn map-btn">🗺️</button>
                <button type="button" class="route-icon-btn delete-btn">✖</button>
            </div>

        </div>

        <button id="add-route-btn" type="button" class="button">
            ➕ Add Another Stop
        </button>

        <button type="submit" class="button">
            SET ROUTE
        </button>

        <div class="note">
            📍 Auto-detect • 🗺️ Google Maps • Max 4 Stops
        </div>
    </div>
</form>

<script src="{% static 'assets/js/set_route.js' %}"></script>
{% endblock content %}
