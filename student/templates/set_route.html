{% extends "base.html" %}
{% load static %}
{% block header %}{% endblock header %}
{% block content %}
<style>
/* Dark mode base */
:root {
    color-scheme: dark;
    --bg-main: #0f1115;
    --bg-card: #181b22;
    --bg-input: #1f242d;
    --border-soft: #2b3040;
    --text-main: #e6e9ef;
    --text-muted: #9aa0ac;
    --primary: #007bff;
    --primary-hover: #0056b3;
    --primary-soft: rgba(0,123,255,0.12);
    --danger: #ff5f6d;
    --danger-soft: rgba(255,95,109,0.12);
}

.modern-card {
    max-width: 700px;
    margin: 0 auto;
    padding: 18px 20px;
    border-radius: 14px;
    background: var(--bg-card);
    box-shadow: 0 20px 40px rgba(0,0,0,0.35);
    color: var(--text-main);
}

.title {
    margin-bottom: 14px;
    color: var(--text-main);
}

.modern-route {
    margin-bottom: 14px;
    padding: 12px;
    border-radius: 10px;
    background: var(--bg-input);
    border: 1px solid var(--border-soft);
}

.route-label {
    font-size: 14px;
    margin-bottom: 6px;
    display: block;
    color: var(--text-muted);
}

.input-modern {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border-soft);
    background: var(--bg-card);
    color: var(--text-main);
}

.input-modern::placeholder {
    color: #6e7685;
}

.route-actions {
    margin-top: 10px;
    display: flex;
    gap: 8px;
}

.route-icon-btn {
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--border-soft);
    background: var(--bg-card);
    color: var(--text-main);
    cursor: pointer;
    transition: all 0.2s;
}

.route-icon-btn:hover {
    background: var(--primary-soft);
    border-color: var(--primary);
}

.form-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 16px;
    gap: 10px;
}

.primary-btn {
    background: var(--primary);
    color: #fff;
    border-radius: 8px;
    padding: 10px 20px;
    border: none;
    cursor: pointer;
    font-weight: 500;
    transition: background 0.2s;
}

.primary-btn:hover {
    background: var(--primary-hover);
}

.primary-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.info-message {
    color: var(--text-muted);
    margin: 0;
}

/* Dropdown styling */
.stop-dropdown {
    position: relative;
    display: inline-block;
}

.dropdown-content {
    display: none;
    position: absolute;
    background: var(--bg-card);
    min-width: 200px;
    box-shadow: 0 8px 16px rgba(0,0,0,0.4);
    z-index: 1;
    border-radius: 8px;
    border: 1px solid var(--border-soft);
    margin-top: 4px;
}

.dropdown-content button {
    color: var(--text-main);
    padding: 10px 14px;
    text-decoration: none;
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    cursor: pointer;
    transition: background 0.2s;
}

.dropdown-content button:first-child {
    border-radius: 8px 8px 0 0;
}

.dropdown-content button:last-child {
    border-radius: 0 0 8px 8px;
}

.dropdown-content button:hover {
    background: var(--bg-input);
}

.stop-dropdown.active .dropdown-content {
    display: block;
}
</style>

<form method="post" action="{% url 'add_route' %}">
    {% csrf_token %}

    <div class="route-container modern-card">
        <h2 class="title">Set Bus Route</h2>

        <div id="routes">
            <div class="route-box modern-route">
                <label class="route-label">Stop 1</label>
                <input type="text" name="stops[]" placeholder="Enter location" required class="input-modern" readonly>
                <div class="route-actions">
                    <div class="stop-dropdown">
                        <button type="button" class="route-icon-btn choose-stop-btn" {% if flag != "green" %}disabled{% endif %}>Choose stop</button>
                        <div class="dropdown-content">
                            <button type="button" class="stop-option" data-stop="Bangalore Central Station">Bangalore Central Station</button>
                            <button type="button" class="stop-option" data-stop="MG Road Metro">MG Road Metro</button>
                            <button type="button" class="stop-option" data-stop="Indiranagar Bus Stand">Indiranagar Bus Stand</button>
                            <button type="button" class="stop-option" data-stop="Koramangala 5th Block">Koramangala 5th Block</button>
                            <button type="button" class="stop-option" data-stop="Electronic City">Electronic City</button>
                            <button type="button" class="stop-option" data-stop="Whitefield Main Road">Whitefield Main Road</button>
                        </div>
                    </div>
                    <button type="button" class="route-icon-btn map-btn">Open map</button>
                </div>
            </div>

            <div class="route-box modern-route">
                <label class="route-label">Stop 2</label>
                <input type="text" name="stops[]" placeholder="Enter location" required class="input-modern" readonly>
                <div class="route-actions">
                    <div class="stop-dropdown">
                        <button type="button" class="route-icon-btn choose-stop-btn" {% if flag != "green" %}disabled{% endif %}>Choose stop</button>
                        <div class="dropdown-content">
                            <button type="button" class="stop-option" data-stop="Bangalore Central Station">Bangalore Central Station</button>
                            <button type="button" class="stop-option" data-stop="MG Road Metro">MG Road Metro</button>
                            <button type="button" class="stop-option" data-stop="Indiranagar Bus Stand">Indiranagar Bus Stand</button>
                            <button type="button" class="stop-option" data-stop="Koramangala 5th Block">Koramangala 5th Block</button>
                            <button type="button" class="stop-option" data-stop="Electronic City">Electronic City</button>
                            <button type="button" class="stop-option" data-stop="Whitefield Main Road">Whitefield Main Road</button>
                        </div>
                    </div>
                    <button type="button" class="route-icon-btn map-btn">Open map</button>
                </div>
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="primary-btn" {% if flag != "green" %}disabled{% endif %}>
                Save route
            </button>
            
            {% if info %}
            <p class="info-message">{{ info }}</p>
            {% endif %}
            
            <button type="button" class="primary-btn" id="next-btn" {% if flag == "green" %}disabled{% endif %}>
                Next
            </button>
        </div>
    </div>
</form>

<script src="{% static 'assets/js/set_route.js' %}"></script>
{% endblock content %}
