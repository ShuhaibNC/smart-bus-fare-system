{% extends "base.html" %}
{% load static %}

{% block header %}{% endblock header %}

{% block content %}

<section id="main" class="container">

    <section class="box" style="max-width: 420px; margin: auto;">
        <header class="major">
            <h2>🔐 Admin Login</h2>
            <p>Authorized access only</p>
        </header>

        <form method="post">
            {% csrf_token %}

            <div class="row gtr-uniform gtr-50">
                <div class="col-12">
                    <input 
                        type="text" 
                        name="admin_id" 
                        placeholder="Admin ID" 
                        required
                    />
                </div>

                <div class="col-12">
                    <input 
                        type="password" 
                        name="password" 
                        placeholder="Password" 
                        required
                    />
                </div>

                <div class="col-12" style="text-align:right;">
                    <a href="#" style="font-size:13px;">
                        Forgot Password?
                    </a>
                </div>

                <div class="col-12">
                    <input 
                        type="submit" 
                        value="Login as Admin" 
                        class="primary fit"
                    />
                </div>
            </div>
        </form>
    </section>

</section>

{% endblock content %}
